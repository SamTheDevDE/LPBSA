name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Build and test
        run: ./gradlew clean build
      - uses: actions/upload-artifact@v4
        with:
          name: LPBSA
          path: build/libs/LPBSA-*.jar
          if-no-files-found: error
